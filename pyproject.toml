[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tsl51"
version = "0.1.0"
description = "Thai Sign Language (TSL-51) Recognition System using PyTorch and MediaPipe"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["sign-language", "thai", "recognition", "pytorch", "mediapipe", "computer-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "huggingface_hub>=0.16.0",
    "opencv-python>=4.7.0",
    "mediapipe>=0.10.0",
    "pillow>=10.0.0",
    "textual>=0.44.0",
    "flask>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.7.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
]

[project.scripts]
tsl-train = "src.cli.train:main"
tsl-inference = "inference:main"
tsl-predict-video = "predict_video:main"
tsl-camera-translate = "camera_translate:main"
tsl-translate = "translate:main"

[project.urls]
Homepage = "https://github.com/yourusername/TSL"
Repository = "https://github.com/yourusername/TSL"
Issues = "https://github.com/yourusername/TSL/issues"

[tool.setuptools.packages.find]
include = ["src*", "tsl_web*"]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.package-data]
tsl_web = ["templates/*.html", "static/*", "models/*"]

[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise without from inside except
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports
"train_tsl51_v3.py" = ["E402"]  # module level import not at top

[tool.black]
target-version = ["py310", "py311", "py312"]
line-length = 100
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.cache
  | build
  | dist
  | \.egg-info
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "legacy/",
    "artifacts/",
    "tsl51_results_*/",
    "tsl-website/",
    "root_archive/",
    "scripts/archive/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "manual: marks tests that are manual/local scripts and skipped from automated CI",
    "gpu: marks tests that require GPU",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/legacy/*",
    "*/artifacts/*",
    "*/tsl51_results_*/*",
    "*/tsl-website/*",
    "*/root_archive/*",
    "*/scripts/archive/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "ARG005", "E402"]
