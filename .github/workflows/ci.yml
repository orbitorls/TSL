name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: windows-latest
    env:
      KMP_DUPLICATE_LIB_OK: "TRUE"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest ruff mypy

      - name: Run ruff check
        run: python -m ruff check src/ --no-fix

      - name: Run mypy (non-blocking)
        run: python -m mypy src/ --ignore-missing-imports
        continue-on-error: true

  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      KMP_DUPLICATE_LIB_OK: "TRUE"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Cache TSL-51 dataset
        uses: actions/cache@v4
        with:
          path: .cache/tsl51/
          key: tsl51-dataset-${{ runner.os }}-${{ hashFiles('src/data/loader.py', 'src/data/loader_expert.py') }}
          restore-keys: |
            tsl51-dataset-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run core tests
        run: |
          python -m pytest tests/core/ tests/test_integration.py tests/test_loader.py -v
        continue-on-error: true
