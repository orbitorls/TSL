[package]
name = "tsl-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TSL command-line demos, ingest, and training"

[[bin]]
name = "tsl-demo-fs"
path = "src/bin/tsl_demo_fs.rs"

[[bin]]
name = "tsl-demo-51"
path = "src/bin/tsl_demo_51.rs"

[[bin]]
name = "tsl-train"
